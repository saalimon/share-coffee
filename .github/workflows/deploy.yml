name: Deploy to GitHub Pages

# Publishes the static site to the `gh-pages` branch on every push to master.
# GitHub Pages serves that branch (Settings → Pages → Deploy from a branch → gh-pages / root).

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js vendor assets _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::8}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages → https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
